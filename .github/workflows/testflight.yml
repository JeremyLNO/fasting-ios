name: TestFlight Release

# Auto-publishes every push to main to TestFlight. Requires 3 repo secrets
# (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       — App Store Connect API Key ID
#   ASC_ISSUER_ID    — App Store Connect API Issuer ID
#   ASC_KEY_P8       — full contents of the AuthKey_<id>.p8 file
# These come from App Store Connect → Users and Access → Integrations →
# App Store Connect API (NOT an APNs key — different key, same portal family).
# Needs an App Store Connect app record for company.lno.fasting to exist first.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        # App Store Connect now rejects uploads built with an SDK older than
        # the current-year iOS SDK — the runner image's *default* Xcode lags
        # behind what's actually installed side-by-side on it.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import signing certificates
        # Both certificates, distribution included. An archive is signed with an *Apple
        # Distribution* identity; with only the development one in the keychain, automatic
        # provisioning tried to mint a new certificate on every run and eventually hit
        # "Your account has reached the maximum number of certificates", which then surfaced as
        # "No profiles for company.lno.fasting were found". Provisioning *profiles* are free to
        # create — certificates are not, so the CI must reuse the ones we already have.
        env:
          DEV_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          DEV_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          DIST_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          import_cert() {
            local payload="$1" password="$2" label="$3"
            if [ -z "$payload" ]; then
              echo "::warning::no $label certificate in secrets, skipping"
              return
            fi
            echo "$payload" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$password" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "imported $label certificate"
          }
          import_cert "$DIST_P12" "$DIST_PASSWORD" distribution
          import_cert "$DEV_P12" "$DEV_PASSWORD" development

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          echo "--- signing identities available ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive (signed, automatic provisioning)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project Fasting.xcodeproj \
            -scheme Fasting \
            -configuration Release \
            -archivePath build/Fasting.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Fasting.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
